# Tóm tắt: CI cho mọi push (main/develop) và pull request — kiểm tra asset, lint, test và build site.
# Đây là check bắt buộc trên main trước khi Cloudflare Pages deploy; workflow KHÔNG có secret và
# chỉ chạy trên runner GitHub-hosted, nên an toàn với PR từ fork.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Push mới lên cùng ref thì hủy lần chạy cũ (chỉ kết quả commit mới nhất là quan trọng).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Không cài git hook của husky trên runner CI.
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Mọi asset đã là blob Git thường (không còn qua LFS) => không cần tải LFS.
          lfs: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify assets are not LFS pointers
        run: node scripts/verify-lfs-assets.js

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

# Tóm tắt: Deploy Cloudflare Worker "yan-failover-redirect" (cloudflare/wrangler.toml) khi code Worker trên main
# thay đổi hoặc bấm tay — chạy unit test Worker trước, deploy bằng wrangler 4, xác nhận qua API bản vừa deploy
# đang nhận 100% traffic, rồi smoke test yamiannephilim.com.
#
# Chọn "npx wrangler@4" thay vì cloudflare/wrangler-action: cùng một lệnh với khi deploy tay ở máy local
# (docs/DEPLOY.md), không thêm action bên thứ ba nào được cầm Cloudflare token, và vẫn ghim major version 4.
# Chỉ trigger từ main / workflow_dispatch (không có pull_request) để token Cloudflare không bao giờ chạm code từ PR.
name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Test, deploy & smoke test Worker
    # Gate bằng biến repo: merge file này khi chưa cấu hình Cloudflare thì workflow chỉ "skipped".
    if: vars.WORKER_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://yamiannephilim.com
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Worker
        run: npx vitest run cloudflare

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Thiếu secret CLOUDFLARE_API_TOKEN hoặc CLOUDFLARE_ACCOUNT_ID (xem docs/DEPLOY.md)."
            exit 1
          fi
          log="${RUNNER_TEMP}/wrangler-deploy.log"
          npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml 2>&1 | tee "${log}"
          # wrangler in "Current Version ID: <uuid>" sau khi deploy — bước kế tiếp dùng nó để đối chiếu qua API.
          # "|| true": grep không khớp không được làm step thoát ngay (pipefail) — để kiểm tra -z bên dưới báo lỗi rõ.
          version_id="$(sed 's/\x1b\[[0-9;]*m//g' "${log}" | { grep -oE 'Current Version ID: [0-9a-f-]{36}' || true; } | tail -n 1 | awk '{ print $4 }')"
          if [ -z "${version_id}" ]; then
            echo "::error::Không đọc được 'Current Version ID' từ output của wrangler deploy."
            exit 1
          fi
          echo "version_id=${version_id}" >> "$GITHUB_OUTPUT"

      # Xác nhận qua Cloudflare API (không phụ thuộc mạng của runner) rằng bản vừa upload đang nhận 100% traffic.
      - name: Verify active deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          set -euo pipefail
          status_json="${RUNNER_TEMP}/deployment-status.json"
          npx --yes wrangler@4 deployments status --config cloudflare/wrangler.toml --json > "${status_json}"
          node -e '
            // Chỉ lấy khối JSON (phòng wrangler in thêm dòng thông báo trước/sau).
            const text = require("fs").readFileSync(process.argv[1], "utf8");
            const status = JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1));
            const versions = Array.isArray(status.versions) ? status.versions : [];
            const active = versions.find((v) => v.version_id === process.env.VERSION_ID);
            console.log("Deployment " + status.id + ": " + versions.map((v) => v.version_id + " " + v.percentage + "%").join(", "));
            if (!active || active.percentage !== 100) {
              console.log("::error::Bản vừa deploy (" + process.env.VERSION_ID + ") không nhận 100% traffic.");
              process.exit(1);
            }
          ' "${status_json}"

      # Worker luôn trả 302 + "Cache-Control: no-store" cho apex, Location đúng một trong hai đích (không có "/"
      # cuối). Page Rules forwarding cũ cũng trả 302 nhưng KHÔNG có no-store => kiểm tra cả Cache-Control.
      # Thử lại vài lần vì bản mới có thể mất vài giây để lan ra mọi PoP.
      - name: Smoke test https://yamiannephilim.com
        # Bảo vệ bot của Cloudflare có thể chặn IP datacenter của runner GitHub-hosted (403, không có Location)
        # TRƯỚC khi request tới Worker. Khi đó không kiểm tra HTTP được từ đây => chỉ cảnh báo: bước "Verify active
        # deployment" chỉ xác nhận VERSION; route do chính wrangler deploy đảm bảo (lỗi nếu route gắn Worker khác),
        # còn Page Rules/Redirect Rules chặn trước Worker thì KHÔNG kiểm tra được — phải curl tay từ máy nhà.
        # Không chạy bước này trên self-hosted runner: hook gha-runner-guard.sh chỉ nhận job của deploy.yml.
        # Mọi phản hồi khác 302 + no-store đúng đích => lỗi.
        run: |
          set -euo pipefail
          blocked=0
          for attempt in 1 2 3 4 5 6; do
            headers="$(curl -sS -o /dev/null -D - --max-time 15 https://yamiannephilim.com | tr -d '\r' || true)"
            status="$(printf '%s\n' "${headers}" | awk 'NR == 1 { print $2 }')"
            location="$(printf '%s\n' "${headers}" | awk 'tolower($1) == "location:" { print $2 }')"
            cache="$(printf '%s\n' "${headers}" | awk 'tolower($1) == "cache-control:" { $1 = ""; sub(/^ /, ""); print tolower($0) }')"
            server="$(printf '%s\n' "${headers}" | awk 'tolower($1) == "server:" { print tolower($2) }')"
            mitigated="$(printf '%s\n' "${headers}" | awk 'tolower($1) == "cf-mitigated:" { print $2 }')"
            ray="$(printf '%s\n' "${headers}" | awk 'tolower($1) == "cf-ray:" { print $2 }')"
            case "${location}" in
              https://portfolio.yamiannephilim.com | https://github.com/Tynab) location_ok=1 ;;
              *) location_ok=0 ;;
            esac
            if [ "${status}" = "302" ] && [ "${location_ok}" = "1" ] && [ "${cache}" = "no-store" ]; then
              echo "OK: HTTP ${status} -> ${location} (cache-control: ${cache})"
              exit 0
            fi
            echo "Lần ${attempt}: status=${status:-<none>} location=${location:-<none>} cache-control=${cache:-<none>} server=${server:-<none>} cf-mitigated=${mitigated:-<none>} cf-ray=${ray:-<none>}"
            if [ "${status}" = "403" ] && [ -z "${location}" ] && [ "${server}" = "cloudflare" ]; then
              blocked=$((blocked + 1))
              # Ba lần liên tiếp bị chặn ở edge => runner này bị bảo vệ bot chặn, thử thêm cũng vô ích.
              [ "${blocked}" -ge 3 ] && break
            else
              blocked=0
            fi
            sleep 10
          done
          if [ "${blocked}" -ge 3 ]; then
            echo "::warning::Cloudflare chặn runner GitHub-hosted ở edge (403, cf-mitigated=${mitigated:-<none>}) trước khi tới Worker — bỏ qua smoke test HTTP. API đã xác nhận version mới nhận 100% traffic, nhưng Page Rules/Redirect Rules CHƯA được kiểm tra: chạy tay curl -sI https://yamiannephilim.com từ máy nhà (kỳ vọng 302 + cache-control: no-store)."
            exit 0
          fi
          echo "::error::https://yamiannephilim.com chưa trả 302 + no-store tới portfolio/GitHub — Worker mới chưa chạy (còn route/Page Rule cũ?)."
          exit 1

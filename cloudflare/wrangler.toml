# Tóm tắt: Cấu hình wrangler để deploy Cloudflare Worker failover (redirect-worker.js) bằng CLI hoặc
# GitHub Actions (.github/workflows/deploy-worker.yml). Trùng tên với Worker đang chạy trên dashboard
# nên mỗi lần deploy sẽ cập nhật Worker đó tại chỗ, không tạo Worker mới. Xem cloudflare/README.md.

name = "yan-schedule-redirect"
# Đường dẫn tính từ thư mục chứa file này (cloudflare/).
main = "redirect-worker.js"
# Ngày cố định trong quá khứ: code chỉ dùng API chuẩn (fetch/Response/AbortController/setTimeout)
# nên không phụ thuộc cờ compatibility mới. Muốn nâng thì đổi ngày rồi chạy lại test + verify.
compatibility_date = "2025-06-01"
# Chỉ chạy trên domain thật, không mở thêm URL *.workers.dev công khai.
workers_dev = false

# Lưu ý về route: wrangler deploy chỉ THAY toàn bộ danh sách route khi credential có quyền trên mọi zone
# (vd. `npx wrangler@4 login` OAuth). Với API token giới hạn theo zone (token CI trong docs/DEPLOY.md),
# deploy chỉ THÊM route còn thiếu, không bao giờ gỡ route — muốn gỡ route phải xóa trên dashboard
# (Worker → Settings → Domains & Routes) VÀ xóa/comment trong file này, nếu không lần deploy sau sẽ gắn lại.
routes = [
  { pattern = "yamiannephilim.com/*", zone_name = "yamiannephilim.com" },
  { pattern = "www.yamiannephilim.com/*", zone_name = "yamiannephilim.com" },
  # TÙY CHỌN — chế độ pass-through cho chính host portfolio: Worker chuyển tiếp mọi request tới origin
  # và chỉ redirect sang GitHub khi origin chết (502/52x/530/không kết nối được) VÀ request là điều
  # hướng trang; asset giữ nguyên status thật. Mọi request (kể cả ảnh/JS) sẽ tính vào quota Workers.
  # Chỉ bỏ comment sau khi đọc mục "Route tùy chọn" trong cloudflare/README.md và verify bằng curl + Logs.
  # { pattern = "portfolio.yamiannephilim.com/*", zone_name = "yamiannephilim.com" },
]

# Bật Workers Logs: xem từng request và dòng log "health probe: ..." ngay trên dashboard (tab Logs).
[observability]
enabled = true

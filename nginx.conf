# Tóm tắt: Server block nginx serve bản build Vite (SPA) — health check /healthz, gzip, chính sách cache theo loại file.
# Thứ tự ưu tiên location của nginx: "= khớp chính xác" > "^~ tiền tố" > regex (theo thứ tự khai báo) > tiền tố thường ("/").
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Image nginx chính thức để "#gzip on;" bị comment, nên bật ở đây cho JS/CSS/SVG/JSON.
  # Không gzip ảnh raster (PNG/JPEG/WebP) và font WOFF2 — vốn đã nén sẵn, gzip chỉ tốn CPU.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    image/x-icon
    application/vnd.ms-fontobject;

  # Health check cho Docker HEALTHCHECK, GitHub Actions deploy và Cloudflare Worker failover.
  # Không đụng file tĩnh, không ghi access log (probe 30 giây/lần), no-store để Cloudflare/browser không cache.
  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # Trình duyệt/crawler vẫn hay xin /favicon.ico ở gốc site: trả icon thật thay vì để SPA fallback trả index.html.
  location = /favicon.ico {
    access_log off;
    add_header Cache-Control "public, max-age=604800";
    try_files /icons/favicon.ico =404;
  }

  # File không có hash trong tên => luôn revalidate. Phải là location "=" vì nếu không,
  # manifest.json sẽ rơi vào regex asset tĩnh bên dưới (cache 7 ngày).
  location = /manifest.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /robots.txt {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # index.html luôn revalidate để bản deploy mới (tên chunk mới) được nhận ngay.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Vite đặt hash nội dung vào tên file trong /assets/ => cache vĩnh viễn.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Ảnh kỹ năng (PNG/WebP) được SoftwareSkill.js gọi kèm ?v=<phiên bản>, đổi ảnh thì bump phiên bản => cache dài hạn an toàn.
  location ^~ /skills/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Asset tĩnh khác (icons/, favicon...) cache 7 ngày. Chỉ dùng add_header (không dùng "expires"):
  # "expires 7d" tự sinh thêm một header Cache-Control thứ hai => trùng header.
  location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|svg|ico|webp|avif|woff2?|ttf|otf|eot|json|webmanifest)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Image nginx chính thức để "#gzip on;" bị comment, nên bật ở đây cho JS/CSS/SVG/JSON.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    image/x-icon
    application/vnd.ms-fontobject
    # mime.types mặc định không khai báo .ttf nên font TTF đi ra dạng octet-stream.
    application/octet-stream;

  # index.html luôn revalidate để bản deploy mới (tên chunk mới) được nhận ngay.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Vite đặt hash nội dung vào tên file trong /assets/ => cache vĩnh viễn.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Ảnh kỹ năng được SoftwareSkill.js gọi kèm ?v=<phiên bản>, đổi PNG thì bump phiên bản => cache dài hạn an toàn.
  location ^~ /skills/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?|ttf|otf|eot|json)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
